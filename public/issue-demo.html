<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>订单金额问题复现</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 28px 20px;
        background: #f5f4f0;
        color: #292c28;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 40px auto;
        padding: 28px;
        background: white;
        border: 1px solid #e4e3dc;
        border-radius: 16px;
      }
      h1 {
        font-size: 24px;
        margin-top: 0;
      }
      p {
        color: #62665d;
      }
      button {
        padding: 12px 20px;
        border: 0;
        border-radius: 8px;
        background: #a64b32;
        color: white;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #292c28;
        outline-offset: 4px;
      }
      section {
        margin-top: 24px;
        padding: 20px;
        border: 1px solid #dedfd7;
        border-radius: 12px;
      }
      dl {
        margin-bottom: 0;
      }
      dt {
        font-size: 14px;
        color: #62665d;
      }
      dd {
        margin: 4px 0 16px;
      }
      [data-testid='order-amount'] {
        font-size: 36px;
        font-weight: 700;
        color: #a64b32;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>订单金额问题复现</h1>
      <p>这是一笔演示订单，可用于测试截图、金额断言和问题追踪。</p>
      <button type="button" id="show-order">查看订单</button>
      <section id="order" aria-label="订单详情" hidden>
        <h2>订单详情</h2>
        <dl>
          <dt>订单编号</dt>
          <dd>DEMO-001</dd>
          <dt>支付金额</dt>
          <dd data-testid="order-amount">¥120.00</dd>
          <dt>订单状态</dt>
          <dd>待支付</dd>
        </dl>
      </section>
    </main>
    <script>
      document.getElementById('show-order').addEventListener('click', () => {
        document.getElementById('order').hidden = false;
      });
    </script>
  </body>
</html>
