        <style>
            html[data-splash-platform='app'] #globalLoading {
                position: fixed;
                left: 0;
                top: 0;
                width: 100vw;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000000;
                background: #fff var(--splash-screen-background) center / cover no-repeat
            }

            html[data-splash-platform='app'] #globalLoading>:not(.splash_icon) {
                display: none
            }

            html[data-splash-platform='app'] .splash_icon {
                position: relative;
                width: 96px;
                height: 96px;
                flex: 0 0 96px;
                overflow: hidden;
                border-radius: 15px
            }

            html[data-splash-platform='app'] .splash_icon.is-error {
                display: none
            }

            html[data-splash-platform='app'] .splash_icon img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover
            }

            html[data-splash-platform='app'] .splash_icon::after {
                content: '';
                position: absolute;
                top: -60%;
                left: 0;
                width: 62%;
                height: 220%;
                pointer-events: none;
                background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.09) 22%, rgba(255,255,255,0.11) 40%, rgba(255,255,255,0.18) 50%, rgba(255,255,255,0.11) 60%, rgba(255,255,255,0.09) 78%, rgba(255,255,255,0) 100%);
                transform: translateX(-180%) rotate(20deg);
                transform-origin: center;
                opacity: 0;
                animation: splash-icon-shine 2220ms linear infinite
            }

            @keyframes splash-icon-shine {
                0%,100% {
                    transform: translateX(-180%) rotate(20deg);
                    opacity: 0
                }

                1% {
                    opacity: 1
                }

                56.76% {
                    transform: translateX(280%) rotate(20deg);
                    opacity: 1
                }

                57.76% {
                    transform: translateX(280%) rotate(20deg);
                    opacity: 0
                }
            }

            html[data-splash-platform='pc'] #globalLoading {
                position: fixed;
                left: 0;
                top: 0;
                width: 100vw;
                height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 10000000;
                background-color: #fff
            }

            html[data-splash-platform='pc'] #globalLoading .splash_icon {
                display: none
            }

            html[data-splash-platform='pc'] #globalLoading .logo {
                display: block !important;
                content: url('https://txcdn-prod-a1art.xiaopiu.com/assets/a1seo-render/a0950807-c11c-493a-ac7c-602aa850d5eb.png');
                transition: opacity .4s cubic-bezier(.4, 0, .2, 1);
                animation: opacity-change 2s ease-in-out infinite
            }

            @keyframes opacity-change {
                0%,100% {
                    opacity: 1
                }

                50% {
                    opacity: .6
                }
            }
        </style>

        <script>
            if (window.location.href.includes('/invite') && window.location.href.includes('source=share')) {
                // 把当前url中的invite删掉
                const url = window.location.href.replace('/invite', '');
                window.location.href = url;
            }
            // 如果设备为 android，url中包含source=share&qr=true且不是 a1 app，先到h5承接页面，则重定向到google play
            if (window.navigator.userAgent.includes('Android') && !window.navigator.userAgent.includes('a1.art.app') && !window.navigator.userAgent.includes('AppWebView/1.0')) {
                const urlParams = new URLSearchParams(window.location.search);
                const source = urlParams.get('source');
                const shareInfo = urlParams.get('share_token');
                const qr = urlParams.get('qr');
                const APPID = 'net.funpack.play';
                if (source === 'share') {
                    // matrix edit
                    const googlePlayUrl = `https://play.google.com/store/apps/details?id=${APPID}&referrer=utm_source%3Dshare,share_info%3D${shareInfo}`;
                    const url = window.location.href.replace(window.location.origin, 'intent://funpack.app.funpack.cc', );
                    const intentUrl = `${url}#Intent;scheme=https;package=${APPID};S.browser_fallback_url=${googlePlayUrl};end`;
                    const deepLinkElement = document.getElementById('deepLink');
                    console.log("source === 'share'", googlePlayUrl, url, intentUrl);
                    deepLinkElement.href = intentUrl;
                    deepLinkElement.click();
                    setTimeout( () => {
                        if (!document.hidden)
                            window.location.href = googlePlayUrl;
                    }
                    , 2000);
                }
            } else if (// ios 用户
            window.navigator.userAgent.includes('iPhone')) {
                const urlParams = new URLSearchParams(window.location.search);
                const source = urlParams.get('source');
                const shareInfo = urlParams.get('share_token');
                if (source === 'share' && shareInfo) {
                    fetch(`/api/resources/v1/short?type=SHARE_TOKEN&shortCode=${shareInfo}`).then( (res) => res.json()).then( (data) => {
                        try {
                            const decryptedData = JSON.parse(data.data);
                            const appId = decryptedData?.app_short_id || decryptedData?.app_id;
                            let intentUrl = 'a1art://';
                            if (appId) {
                                intentUrl += `appDetail/${appId}`;
                            }

                            deepLinkElement.href = intentUrl;
                            deepLinkElement.click();

                        }
