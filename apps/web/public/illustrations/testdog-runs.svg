<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none"><title>testdog — runs</title><style>
.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tilt{animation:tilt 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.paw{opacity:.2;animation:step 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.second{animation-delay:.6s}.third{animation-delay:1.2s}.fourth{animation-delay:1.8s}
.nose{animation:sniff 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes step{0%,65%,100%{opacity:.2;transform:scale(.94)}20%,40%{opacity:1;transform:scale(1)}}
@keyframes sniff{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media(prefers-reduced-motion:reduce){.float,.tilt,.paw,.nose{animation:none}.paw{opacity:.7}}
</style><ellipse cx="80" cy="103" rx="36" ry="2" fill="#eee7df"/><g class="float"><rect x="38" y="30" width="84" height="56" rx="13" fill="#faf1eb" stroke="#d8b8a8" stroke-width="1.4"/><path d="M73 46l17 12-17 12Z" fill="#b45736" stroke="#b45736" stroke-width="1.5" stroke-linejoin="round"/><path d="M66 96h28M80 86v10" stroke="#d8b8a8" stroke-width="1.5" stroke-linecap="round"/></g><g transform="translate(124 83) rotate(-15)"><g class="paw " fill="#b45736"><path d="M-7 5C-4-3 4-3 7 5C10 12 4 13 0 11C-4 13-10 12-7 5Z"/><ellipse cx="-9" cy="-3" rx="3" ry="4" transform="rotate(-25 -9 -3)"/><ellipse cx="-3" cy="-8" rx="3" ry="4"/><ellipse cx="4" cy="-8" rx="3" ry="4"/><ellipse cx="10" cy="-2" rx="3" ry="4" transform="rotate(25 10 -2)"/></g></g></svg>
