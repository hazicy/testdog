name: testdog

x-app: &app
  image: testdog:local
  build: .
  env_file:
    - .env.production
  environment:
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-testdog}
    REDIS_URL: redis://redis:6379
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
    BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
    TESTDOG_DATA_DIR: /data
    AUTOMATION_HEADLESS: 'true'
  volumes:
    - automation_data:/data

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-testdog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: ['pnpm', 'db:migrate']
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    restart: unless-stopped
    command: ['pnpm', 'start']
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    hostname: testdog-worker
    restart: unless-stopped
    command: ['pnpm', 'worker:start']
    init: true
    shm_size: '1gb'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  automation_data:
